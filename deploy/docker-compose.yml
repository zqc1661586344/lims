version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: lims-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lims}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-lims}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - lims-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lims}"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: lims-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-lims}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - lims-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 3

  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: lims-migrate
    environment:
      LIMS_ENV: "production"
      LIMS_DATABASE_HOST: postgres
      LIMS_DATABASE_PORT: 5432
      LIMS_DATABASE_USER: ${POSTGRES_USER:-lims}
      LIMS_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      LIMS_DATABASE_DBNAME: ${POSTGRES_DB:-lims}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["./lims-migrate"]
    networks:
      - lims-net
    restart: "no"

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: lims-backend
    environment:
      LIMS_ENV: "production"
      LIMS_DATABASE_HOST: postgres
      LIMS_DATABASE_PORT: 5432
      LIMS_DATABASE_USER: ${POSTGRES_USER:-lims}
      LIMS_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      LIMS_DATABASE_DBNAME: ${POSTGRES_DB:-lims}
      LIMS_MINIO_ENDPOINT: minio:9000
      LIMS_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-lims}
      LIMS_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - lims-net

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: lims-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - lims-net

networks:
  lims-net:
    driver: bridge

volumes:
  postgres_data:
  minio_data: